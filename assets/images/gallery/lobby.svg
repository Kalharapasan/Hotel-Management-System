<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#FFF8DC"/>
  <!-- Floor -->
  <rect y="250" width="400" height="50" fill="#D2B48C" stroke="#8B7355" stroke-width="2"/>
  <!-- Walls -->
  <rect x="0" y="0" width="400" height="250" fill="#FFFAF0" stroke="#8B7355" stroke-width="2"/>
  <!-- Chandelier -->
  <circle cx="200" cy="30" r="20" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
  <line x1="200" y1="50" x2="200" y2="80" stroke="#DAA520" stroke-width="2"/>
  <!-- Pillars -->
  <rect x="50" y="100" width="40" height="150" fill="#D3D3D3" stroke="#8B8B8B" stroke-width="2"/>
  <rect x="310" y="100" width="40" height="150" fill="#D3D3D3" stroke="#8B8B8B" stroke-width="2"/>
  <!-- Seating -->
  <rect x="150" y="150" width="80" height="60" fill="#CD853F" stroke="#8B4513" stroke-width="2"/>
  <ellipse cx="190" cy="145" rx="30" ry="15" fill="#DEB887"/>
  <!-- Decorative plant -->
  <rect x="100" y="210" width="15" height="40" fill="#8B4513"/>
  <ellipse cx="107" cy="200" rx="20" ry="15" fill="#228B22"/>
  <ellipse cx="92" cy="195" rx="15" ry="12" fill="#32CD32"/>
  <ellipse cx="122" cy="195" rx="15" ry="12" fill="#32CD32"/>
  <!-- Text -->
  <text x="200" y="285" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Hotel Lobby</text>
</svg>
