  <ellipse cx="200" cy="130" rx="80" ry="50" fill="#FA8072" stroke="#DC143C" stroke-width="2"/>
  <!-- Lemon slice -->
  <circle cx="140" cy="180" r="25" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>
