<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="300" fill="#FFF8DC"/>
  <rect x="20" y="20" width="360" height="260" fill="#DEB887" stroke="#8B4513" stroke-width="3"/>
  <!-- Bed -->
  <rect x="50" y="80" width="300" height="150" fill="#8B0000" stroke="#660000" stroke-width="2"/>
  <rect x="50" y="80" width="300" height="80" fill="#DC143C"/>
  <ellipse cx="200" cy="140" rx="140" ry="20" fill="#FF69B4" opacity="0.5"/>
  <!-- Pillow -->
  <rect x="50" y="65" width="120" height="20" fill="#FFFACD" stroke="#333" stroke-width="1"/>
  <!-- Window -->
  <rect x="320" y="40" width="60" height="100" fill="#87CEEB" stroke="#333" stroke-width="2"/>
  <line x1="350" y1="40" x2="350" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="320" y1="90" x2="380" y2="90" stroke="#333" stroke-width="1"/>
  <!-- Door -->
  <rect x="20" y="200" width="50" height="80" fill="#8B4513" stroke="#333" stroke-width="2"/>
  <circle cx="65" cy="240" r="4" fill="#FFD700"/>
  <!-- Text -->
  <text x="200" y="285" font-size="16" font-weight="bold" text-anchor="middle" fill="#333">Standard Single Room</text>
</svg>
